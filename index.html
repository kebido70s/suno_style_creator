<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suno AI 궁극의 스타일 생성기 (Custom Memory)</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #d8b4fe;
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .section {
            background: #1e1e1e;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .section h2 {
            font-size: 1.2em;
            color: #a855f7;
            margin-top: 0;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag {
            background-color: #333;
            color: #fff;
            padding: 6px 10px 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
            user-select: none;
            display: flex;
            align-items: center;
        }
        .tag:hover {
            background-color: #444;
        }
        .tag.active {
            background-color: #a855f7;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
        }
        .btn-delete {
            margin-left: 8px;
            color: #ff6b6b;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1em;
            line-height: 1;
            padding: 0 4px;
            border-radius: 50%;
        }
        .btn-delete:hover {
            background-color: #ff6b6b;
            color: #fff;
        }
        .custom-input {
            background-color: #000;
            border: 1px dashed #a855f7;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            outline: none;
            font-size: 0.9em;
            width: 150px;
        }
        .custom-input::placeholder {
            color: #888;
        }
        .output-section {
            background: #2a1b38;
            padding: 20px;
            border-radius: 8px;
            margin-top: 25px;
            border: 1px solid #a855f7;
        }
        .output-section h2 {
            color: #d8b4fe;
            margin-top: 0;
        }
        #finalPrompt {
            width: 100%;
            height: 100px;
            background: #000;
            color: #4ade80;
            padding: 15px;
            border: none;
            border-radius: 6px;
            font-family: monospace;
            font-size: 1.1em;
            resize: vertical;
            box-sizing: border-box;
        }
        .btn-copy {
            background-color: #a855f7;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .btn-copy:hover {
            background-color: #9333ea;
        }
        .instruction {
            font-size: 0.85em;
            color: #aaa;
            font-weight: normal;
        }
        .header-controls {
            text-align: right;
            margin-bottom: 10px;
        }
        .btn-reset {
            background-color: #333;
            color: #ccc;
            border: 1px solid #555;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
        }
        .btn-reset:hover {
            background-color: #444;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎧 Suno AI 궁극의 스타일 생성기</h1>
    <p style="text-align: center; color: #ccc;">원하는 키워드를 클릭하거나, 입력창에 직접 타이핑 후 <strong>Enter</strong>를 눌러 추가하세요.<br>항목 옆의 <strong>X</strong>를 누르면 삭제되며, 모든 변경사항은 브라우저에 자동 저장됩니다.</p>
    
    <div class="header-controls">
        <button class="btn-reset" onclick="resetAllData()">초기 상태로 되돌리기</button>
    </div>

    <div id="app"></div>

    <div class="output-section">
        <h2>✨ 최종 Suno 프롬프트</h2>
        <textarea id="finalPrompt" readonly placeholder="선택된 항목이 여기에 쉼표(,)로 구분되어 표시됩니다..."></textarea>
        <button class="btn-copy" onclick="copyPrompt()">클립보드에 복사</button>
    </div>
</div>

<script>
    // 기본 제공 데이터
    const defaultData = [
        { id: 'genre', title: '🌍 글로벌 장르', items: ['K-Pop', 'J-Pop', 'Afrobeat', 'Latin Pop', 'Bossa Nova', 'Flamenco', 'Celtic', 'Middle Eastern', 'Synthwave', 'Lo-fi', 'Cinematic', 'Reggae', 'Mariachi', 'Trot'] },
        { id: 'crossover', title: '🧬 오버크로스 (융합 장르)', items: ['Classical Crossover', 'Folktronica', 'Jazz-Hop', 'Electro-Tango', 'Country-Trap', 'Symphonic Metal', 'Nu-Disco', 'Worldbeat'] },
        { id: 'mood', title: '🎭 분위기 (Mood)', items: ['Energetic', 'Melancholic', 'Dreamy', 'Aggressive', 'Uplifting', 'Dark', 'Chill', 'Exotic', 'Mystical', 'Passionate', 'Nostalgic', 'Futuristic'] },
        { id: 'tempo', title: '⏱️ 상세 템포 및 그루브', items: ['Largo (Very Slow)', 'Adagio (Slow)', '80 BPM', 'Andante (Walking Pace)', '100 BPM', 'Allegro (Fast)', '128 BPM (Dance)', 'Presto (Very Fast)', '150+ BPM', 'Laid-back Groove', 'Driving Beat', 'Rubato', 'Syncopated'] },
        { id: 'vocal', title: '🎤 보컬 스타일', items: ['Female Vocal', 'Male Vocal', 'Husky', 'Autotune', 'High-pitched', 'Emotional', 'Soulful', 'Operatic', 'Throat Singing', 'Rhythmic Chants', 'Dual Vocals'] },
        { id: 'instrument', title: '🎻 전 세계 악기 구성 (국가 포함)', items: ['Analog Synth (Global)', '808 Drums (USA/Global)', 'Acoustic Guitar (Spain)', 'Sitar (India)', 'Tabla (India)', 'Koto (Japan)', 'Shamisen (Japan)', 'Djembe (West Africa)', 'Duduk (Armenia)', 'Accordion (Europe)', 'Haegeum (Korea)', 'Gayageum (Korea)', 'Marimba (Latin America)', 'Bandoneon (Argentina)', 'Didgeridoo (Australia)', 'Guzheng (China)', 'Orchestral Strings', 'Brass Section'] }
    ];

    // 로컬 스토리지에서 데이터 불러오기
    let customTags = JSON.parse(localStorage.getItem('sunoCustomTags')) || {};
    let deletedTags = JSON.parse(localStorage.getItem('sunoDeletedTags')) || {};
    let activeTagsSet = new Set(); // 현재 선택된 태그 상태 유지를 위해

    const appContainer = document.getElementById('app');

    function saveState() {
        localStorage.setItem('sunoCustomTags', JSON.stringify(customTags));
        localStorage.setItem('sunoDeletedTags', JSON.stringify(deletedTags));
    }

    function renderSections() {
        appContainer.innerHTML = '';
        
        defaultData.forEach(section => {
            const sectionDiv = document.createElement('div');
            sectionDiv.className = 'section';
            
            const title = document.createElement('h2');
            title.innerHTML = `${section.title} <span class="instruction">+ 자유 입력 및 삭제 가능</span>`;
            sectionDiv.appendChild(title);

            const tagsContainer = document.createElement('div');
            tagsContainer.className = 'tags-container';
            tagsContainer.id = `container-${section.id}`;

            // 기본 태그 중 삭제되지 않은 것들 필터링
            let currentItems = section.items.filter(item => !(deletedTags[section.id] && deletedTags[section.id].includes(item)));
            
            // 커스텀 태그 추가
            if (customTags[section.id]) {
                currentItems = currentItems.concat(customTags[section.id]);
            }

            // 태그 렌더링
            currentItems.forEach(item => {
                const tag = createTagElement(section.id, item);
                tagsContainer.appendChild(tag);
            });

            // 직접 입력 창 렌더링
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'custom-input';
            input.placeholder = '+ 직접 입력 후 Enter';
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && this.value.trim() !== '') {
                    const newValue = this.value.trim();
                    if (!customTags[section.id]) customTags[section.id] = [];
                    
                    // 중복 방지
                    if (!currentItems.includes(newValue)) {
                        customTags[section.id].push(newValue);
                        saveState();
                        renderSections();
                    }
                    this.value = '';
                }
            });
            tagsContainer.appendChild(input);

            sectionDiv.appendChild(tagsContainer);
            appContainer.appendChild(sectionDiv);
        });
        updatePrompt();
    }

    function createTagElement(sectionId, text) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        
        // 고유 ID 생성으로 상태 유지
        const tagUniqueId = `${sectionId}-${text}`;
        if (activeTagsSet.has(tagUniqueId)) {
            tag.classList.add('active');
        }

        const textSpan = document.createElement('span');
        textSpan.textContent = text;
        tag.appendChild(textSpan);

        // 삭제 버튼 생성
        const deleteBtn = document.createElement('span');
        deleteBtn.className = 'btn-delete';
        deleteBtn.innerHTML = '&times;';
        deleteBtn.onclick = function(e) {
            e.stopPropagation(); // 태그 클릭 이벤트(활성화) 방지
            
            // 활성화된 태그였다면 Set에서 제거
            activeTagsSet.delete(tagUniqueId);

            // 삭제 로직: 커스텀 태그인지 기본 태그인지 확인
            if (customTags[sectionId] && customTags[sectionId].includes(text)) {
                customTags[sectionId] = customTags[sectionId].filter(t => t !== text);
            } else {
                if (!deletedTags[sectionId]) deletedTags[sectionId] = [];
                deletedTags[sectionId].push(text);
            }
            
            saveState();
            renderSections();
        };
        tag.appendChild(deleteBtn);

        // 태그 클릭 시 활성화/비활성화
        tag.onclick = function() {
            this.classList.toggle('active');
            if (this.classList.contains('active')) {
                activeTagsSet.add(tagUniqueId);
            } else {
                activeTagsSet.delete(tagUniqueId);
            }
            updatePrompt();
        };

        return tag;
    }

    function updatePrompt() {
        const activeTags = document.querySelectorAll('.tag.active > span:first-child');
        const promptArray = Array.from(activeTags).map(span => span.textContent);
        document.getElementById('finalPrompt').value = promptArray.join(', ');
    }

    function copyPrompt() {
        const promptText = document.getElementById('finalPrompt');
        if (!promptText.value) return;
        promptText.select();
        promptText.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(promptText.value).then(() => {
            alert('프롬프트가 클립보드에 복사되었습니다! Suno에 붙여넣기 하세요.');
        });
    }

    function resetAllData() {
        if(confirm("추가한 항목과 삭제한 항목이 모두 초기화됩니다. 계속하시겠습니까?")) {
            localStorage.removeItem('sunoCustomTags');
            localStorage.removeItem('sunoDeletedTags');
            customTags = {};
            deletedTags = {};
            activeTagsSet.clear();
            renderSections();
        }
    }

    // 초기 렌더링 실행
    renderSections();
</script>

</body>
</html>
